<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You!</title>
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Beige background, slight warm tint */
      background: #F5F1E9;
      /* Default dark blue text color */
      color: #1E3A8A;
      padding: 20px;
    }

    .card {
      /* Matching beige card but slightly lighter/purer */
      background: #FFFFFF;
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      /* Soft shadow for depth, no dark mode glow needed */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* Animated Checkmark Icon */
    .icon-container {
      width: 80px;
      height: 80px;
      /* Lighter blue for the icon background */
      background: rgba(30, 58, 138, 0.1);
      /* Main dark blue for border/icon */
      border: 2px solid #1E3A8A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      /* Soft shadow matching card */
      box-shadow: 0 0 15px rgba(30, 58, 138, 0.2);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .icon-container svg {
      width: 40px;
      height: 40px;
      stroke: #1E3A8A;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1E3A8A;
      letter-spacing: -0.5px;
    }

    p {
      /* Slightly muted dark blue for paragraphs */
      color: #3B82F6;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 28px;
      /* Solid primary blue background */
      background: #2563EB;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 12px;
      /* Moderate blue shadow */
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      /* Stronger blue shadow on hover */
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.5);
      /* Lighter blue background on hover for feedback */
      background: #3B82F6;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
      }
      80% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    
    <h1>Thank You!</h1>
    
    <p>
      Your message has been successfully received.<br>
      Our team will get back to you shortly.
    </p>

    <a href="index.html" class="btn">Back To Home</a>
  </div>

</body>
</html>
