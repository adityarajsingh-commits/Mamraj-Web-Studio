<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful | MamRaj Web Studio</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="success-container">

<div class="success-card">

<div class="success-icon">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>

Payment Successful

</h1>

<p>

Thank you for choosing

<strong>MamRaj Web Studio</strong>

</p>

<p>

Your order has been received successfully.

</p>

<div class="success-buttons">

<a href="index.html" class="home-btn">

<i class="fa-solid fa-house"></i>

Back to Home

</a>

<a href="cart.html" class="invoice-btn">

<i class="fa-solid fa-cart-shopping"></i>

Continue Shopping

</a>

</div>

</div>

</div>

<style>

body{

margin:0;

font-family:'Poppins',sans-serif;

background:#f5f7fb;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.success-card{

background:#fff;

padding:60px;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.15);

text-align:center;

max-width:550px;

width:90%;

}

.success-icon{

font-size:90px;

color:#28a745;

margin-bottom:20px;

animation:pop .6s ease;

}

.success-card h1{

color:#1E2A5A;

margin-bottom:15px;

}

.success-card p{

color:#666;

line-height:1.8;

}

.success-buttons{

margin-top:40px;

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.home-btn,

.invoice-btn{

padding:14px 28px;

border-radius:10px;

text-decoration:none;

color:#fff;

background:#1E2A5A;

transition:.3s;

}

.invoice-btn{

background:#C58B73;

}

.home-btn:hover,

.invoice-btn:hover{

transform:translateY(-4px);

}

@keyframes pop{

0%{

transform:scale(0);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

</style>

</body>

</html>
